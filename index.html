<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 3 Months Anniversary! 💕</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: #ff4b2b;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 20px;
            padding: 20px;
        }

        .btn {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
            transition: transform 0.2s;
            margin-top: 15px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Gallery */
        .gallery {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 10px;
            padding: 10px 0;
            margin-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }

        .gallery img {
            scroll-snap-align: center;
            width: 100%;
            max-width: 380px;
            height: 280px;
            object-fit: cover;
            border-radius: 15px;
            flex-shrink: 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        /* Interactive Question */
        .question-box {
            background: #fff0f3;
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .btn-yes {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        .btn-no {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            position: relative;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop src="song.mp3"></audio>

    <div class="card">
        <!-- Start Overlay -->
        <div class="overlay" id="startOverlay">
            <h2>💕 Happy 3 Months 💕</h2>
            <p style="margin-top: 10px; color: #666;">ဖွင့်ကြည့်ဖို့ အောက်က ခလုတ်လေးကို နှိပ်ပါနော်</p>
            <button class="btn" onclick="startApp()">Open 💕</button>
        </div>

        <!-- Main Content -->
        <h1>Happy 3rd Month Anniversary! ✨</h1>
        <p class="subtitle">ငါတို့ဆုံတွေ့ခဲ့တာ ၃ လပြည့်သွားပြီနော် ❤️</p>

        <!-- Photo Gallery -->
        <div class="gallery">
            <img src="photo1.jpg" alt="Memory 1" onerror="this.src='https://via.placeholder.com/380x280?text=Photo+1'">
            <img src="photo2.jpg" alt="Memory 2" onerror="this.src='https://via.placeholder.com/380x280?text=Photo+2'">
            <img src="photo3.jpg" alt="Memory 3" onerror="this.src='https://via.placeholder.com/380x280?text=Photo+3'">
            <img src="photo4.jpg" alt="Memory 4" onerror="this.src='https://via.placeholder.com/380x280?text=Photo+4'">
            <img src="photo5.jpg" alt="Memory 5" onerror="this.src='https://via.placeholder.com/380x280?text=Photo+5'">
        </div>

        <p style="font-size: 0.85rem; color: #888;">👈 ဘေးသို့ ဆွဲကြည့်ပါ 👉</p>

        <!-- Interactive Question -->
        <div class="question-box">
            <p id="questionText">ငါ့ကို အရင်ကထက် ပိုချစ်လား? 🥺</p>
            <div class="btn-group" id="btnGroup">
                <button class="btn-yes" onclick="sayYes()">ချစ်တာပေါ့ ❤️</button>
                <button class="btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">မချစ်ပါဘူး 😜</button>
            </div>
            <p id="loveResponse" class="hidden" style="color: #ff4b2b; font-weight: bold; margin-top: 10px;">
                အမြဲတမ်း ပိုချစ်ပေးရမယ်နော်! 💖✨
            </p>
        </div>
    </div>

    <script>
        function startApp() {
            document.getElementById('startOverlay').style.display = 'none';
            var music = document.getElementById('bgMusic');
            music.play().catch(function(error) {
                console.log("Audio play failed: ", error);
            });
        }

        function sayYes() {
            document.getElementById('btnGroup').classList.add('hidden');
            document.getElementById('loveResponse').classList.remove('hidden');
        }

        function moveButton() {
            var btn = document.getElementById('noBtn');
            var x = Math.random() * (window.innerWidth - 100);
            var y = Math.random() * (window.innerHeight - 50);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>
</body>
</html>
